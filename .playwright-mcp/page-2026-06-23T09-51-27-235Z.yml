                  - generic:
                    - paragraph: Cancellation Policy
                    - paragraph: Free cancellation up to 24 hours before check-in. Cancellations made within 24 hours of arrival may incur a one-night charge.
                  - generic:
                    - paragraph: Payment Policy
                    - paragraph: Guests may pay online at the time of booking or at the property, subject to availability and hotel rules.
                  - generic:
                    - paragraph: Child Policy
                    - paragraph: Children below 5 years stay free when using existing bedding. Extra beds are subject to availability and additional charges.
                  - generic:
                    - paragraph: Privacy Policy
                    - paragraph: Guest information is collected solely for booking and hospitality purposes and is not shared with third parties except where required by law.
                  - generic:
                    - paragraph: Important Information
                    - paragraph: Valid government-issued photo identification is required at check-in. Early check-in and late check-out are subject to availability. The hotel reserves the right to refuse service in accordance with applicable laws and regulations.
