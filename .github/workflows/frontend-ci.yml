name: Frontend CI

on:
  push:
    branches: [ "main", "develop", "claude/**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type check
      run: npx tsc --noEmit

    # Heavy browser-based E2E only runs against main (PRs into main or pushes to
    # main) to conserve Actions minutes on feature branches. Type-check + build
    # still run everywhere as the fast regression gate.
    - name: Cache Playwright browsers
      if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Playwright Browsers
      if: (github.ref == 'refs/heads/main' || github.base_ref == 'main') && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    - name: Install Playwright system deps (cache hit)
      if: (github.ref == 'refs/heads/main' || github.base_ref == 'main') && steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Build
      env:
        VITE_API_URL: 'http://localhost:9999'
        VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
        VITE_SUPABASE_ANON_KEY: 'placeholder-anon-key'
      run: npm run build

    - name: Run Playwright tests
      if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
      env:
        VITE_API_URL: 'http://localhost:9999'
        VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
        VITE_SUPABASE_ANON_KEY: 'placeholder-anon-key'
        CI: 'true'
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: always() && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
