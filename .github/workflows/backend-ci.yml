name: Backend CI

# Runs on PRs (any target) and on pushes to main/develop/feature branches,
# so regressions are caught before merge rather than after deploy.
on:
  push:
    branches: [ "main", "develop", "claude/**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Compile check (fail fast on syntax / import errors)
      run: python -m compileall -q app main.py

    - name: Run tests with coverage
      env:
        SECRET_KEY: "CI_TEST_SECRET_KEY_32_CHARS_MIN__"
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        REDIS_URL: ""
        SUPABASE_URL: ""
        SUPABASE_SERVICE_ROLE_KEY: ""
      run: |
        pytest tests/ -v --tb=short \
          --cov=app --cov-report=term-missing --cov-report=xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: backend/coverage.xml
        retention-days: 30

  security-scan:
    # Non-blocking dependency vulnerability scan — surfaces known CVEs in
    # third-party packages without failing the build (tighten to a gate later).
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pip-audit
      run: python -m pip install --upgrade pip pip-audit
    - name: Audit dependencies for known CVEs
      run: pip-audit -r requirements.txt || true
