name: Backend CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR branches are covered by `pull_request`; `push` only fires for the trunk
# branches (post-merge). This stops the whole suite running TWICE for every
# commit on a PR branch (once for push to the branch, once for the PR), which
# was doubling CI time and minutes.
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Compile check (fail fast on syntax / import errors)
      run: python -m compileall -q app main.py

    - name: Run tests with coverage
      env:
        SECRET_KEY: "CI_TEST_SECRET_KEY_32_CHARS_MIN__"
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        REDIS_URL: ""
        SUPABASE_URL: ""
        SUPABASE_SERVICE_ROLE_KEY: ""
      run: |
        pytest tests/ -v --tb=short \
          --cov=app --cov-report=term-missing --cov-report=xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: backend/coverage.xml
        retention-days: 30

  security-scan:
    # Non-blocking dependency vulnerability scan and SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install security tools (pip-audit & bandit)
      run: python -m pip install --upgrade pip pip-audit bandit
    - name: Audit dependencies for known CVEs
      run: pip-audit -r requirements.txt || true
    - name: Run Bandit SAST on Application Code
      run: bandit -r app/ -c "bandit.yaml" -ll || true
